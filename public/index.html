<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryRoute</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StoryRoute">
<meta name="theme-color" content="#f0a500">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:sans-serif; overflow:hidden; }
#map { width:100vw; height:100vh; }
.leaflet-control-container { display:none !important; }

#header { position:fixed; top:0; left:0; right:0; z-index:1000; padding:10px 16px; background:rgba(255,255,255,0.95); border-bottom:1px solid rgba(0,0,0,0.08); display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
#app-name { font-size:20px; font-weight:800; color:#1a2240; margin-left:10px; }
#app-name span { color:#f0a500; }
#status { font-size:11px; background:rgba(0,0,0,0.05); border:1px solid rgba(0,0,0,0.08); padding:4px 10px; border-radius:12px; color:#666; max-width:175px; text-align:right; line-height:1.4; }

#mode-toggle { position:fixed; top:62px; left:50%; transform:translateX(-50%); z-index:999; display:flex; background:rgba(255,255,255,0.95); border:1px solid rgba(0,0,0,0.1); border-radius:20px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
.mode-btn { padding:7px 18px; font-size:12px; font-weight:700; border:none; background:transparent; color:rgba(0,0,0,0.4); cursor:pointer; }
.mode-btn.active { background:#f0a500; color:#fff; }

#route-panel { position:fixed; top:106px; left:16px; right:16px; z-index:999; background:#fff; border:1px solid rgba(0,0,0,0.1); border-radius:14px; padding:14px; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
#route-panel.visible { display:block; }
.r-input { width:100%; padding:10px 13px; background:rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.12); border-radius:8px; color:#222; font-size:14px; outline:none; margin-bottom:8px; }
.r-input::placeholder { color:rgba(0,0,0,0.3); }
.r-input:focus { border-color:#f0a500; }
.r-btn { width:100%; padding:11px; background:#f0a500; color:#fff; border:none; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer; }
.r-btn:disabled { background:#ccc; color:#888; cursor:not-allowed; }

/* Start/Stop bar */
#tour-bar {
  position:fixed; bottom:16px; left:16px; right:16px; z-index:1001;
  display:flex; gap:10px; align-items:center;
  background:#fff; border:1px solid rgba(0,0,0,0.1);
  border-radius:14px; padding:10px 14px;
  box-shadow:0 4px 16px rgba(0,0,0,0.1);
  transition:bottom .3s;
}
#tour-bar.raised { bottom:200px; }
#start-tour-btn {
  flex:1; padding:12px; background:#f0a500; color:#fff;
  border:none; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
#start-tour-btn.stop { background:#e53935; }
#tour-status { font-size:11px; color:#999; text-align:center; margin-top:6px; }

#zoom { position:fixed; bottom:100px; right:14px; z-index:1000; display:flex; flex-direction:column; gap:6px; }
.zbtn { width:40px; height:40px; background:#fff; border:1px solid rgba(0,0,0,0.15); border-radius:8px; color:#333; font-size:22px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.15); display:flex; align-items:center; justify-content:center; }
.zbtn:hover { background:#f0a500; color:#fff; border-color:#f0a500; }

#story { position:fixed; bottom:0; left:0; right:0; padding:14px 16px 100px; background:#fff; border-top:1px solid rgba(0,0,0,0.08); display:none; z-index:1000; box-shadow:0 -4px 20px rgba(0,0,0,0.08); }
#story-name { font-size:10px; font-weight:700; color:#f0a500; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:4px; }
#story-text { font-size:14px; line-height:1.7; color:#222; margin-bottom:10px; }
#story-btns { display:flex; gap:8px; }
#replay-btn { flex:1; padding:10px; background:rgba(0,0,0,0.05); color:#333; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; }
#skip-btn   { padding:10px 20px; background:#f0a500; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:700; }
#skip-btn:disabled { background:#ccc; color:#888; cursor:not-allowed; }
#next-preview { margin-top:10px; padding:8px 12px; background:rgba(240,165,0,0.06); border:1px solid rgba(240,165,0,0.2); border-radius:8px; font-size:11px; color:#888; display:none; }
#next-preview b { color:#e09400; }

.lm-marker { font-size:22px; cursor:pointer; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3)); transition:transform .2s; }
.lm-marker:hover { transform:scale(1.2); }
.lm-marker.visited { opacity:0.3; filter:grayscale(1); }
.leaflet-tooltip { background:#fff; border:1px solid rgba(240,165,0,0.5); color:#222; font-size:12px; font-weight:600; padding:4px 9px; border-radius:6px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="header">
  <div style="display:flex;align-items:center;">
    <img src="/icon-512.png" style="height:40px;width:auto;" onerror="this.style.display='none'"/>
    <span id="app-name">Story<span>Route</span></span>
  </div>
  <div id="status">Starting…</div>
</div>

<div id="mode-toggle">
  <button class="mode-btn active" id="btn-explore" onclick="setMode('explore')">📍 Explore</button>
  <button class="mode-btn" id="btn-route" onclick="setMode('route')">🗺️ Route</button>
</div>

<div id="route-panel">
  <input class="r-input" id="from-inp" placeholder="📍 From — e.g. Dublin Airport"/>
  <input class="r-input" id="to-inp" placeholder="🏁 To — e.g. Trinity College"/>
  <button class="r-btn" id="route-btn" onclick="planRoute()">Plan Route & Discover Stories</button>
</div>

<!-- Story panel -->
<div id="story">
  <div id="story-name"></div>
  <div id="story-text"></div>
  <div id="story-btns">
    <button id="replay-btn" onclick="replayStory()">▶ Replay</button>
    <button id="skip-btn" onclick="skipStory()" disabled>⏭ Skip</button>
  </div>
  <div id="next-preview"></div>
</div>

<!-- Start / Stop tour bar -->
<div id="tour-bar">
  <button id="start-tour-btn" onclick="toggleTour()">▶ Start Listening</button>
</div>

<div id="zoom">
  <button class="zbtn" onclick="map.setZoom(map.getZoom()+1)">+</button>
  <button class="zbtn" onclick="map.setZoom(map.getZoom()-1)">−</button>
</div>

<!-- Launch overlay -->
<div id="overlay" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;">
  <img src="/icon-512.png" style="width:96px;height:96px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,0.12)" onerror="this.style.display='none'"/>
  <div style="font-size:28px;font-weight:800;color:#1a2240;">Story<span style="color:#f0a500;">Route</span></div>
  <div style="font-size:14px;color:#999;text-align:center;max-width:260px;line-height:1.6;">Historical stories about places around you, as you explore.</div>
  <button onclick="initApp()" style="padding:16px 48px;background:#f0a500;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(240,165,0,0.35);">Open Map</button>
  <div style="font-size:11px;color:#ccc;">Allow location access when prompted</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DUBLIN = [53.3438, -6.2546];
const TYPE_ICON = { monument:'🏛',church:'⛪',castle:'🏰',street:'🛤',building:'🏢',bridge:'🌉',park:'🌿',museum:'🎭',neighbourhood:'🏘',person:'👤',nature:'🌊',pub:'🍺',other:'📍' };
const FETCH_TIMEOUT_MS = 30000; // 30s per landmark fetch

let map = L.map('map',{zoomControl:false,attributionControl:false}).setView(DUBLIN,15);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
map.on('moveend', () => { if(landmarksLoaded) doFetchLandmarks(map.getCenter().lat, map.getCenter().lng); });

let markers={}, visited=new Set(), fetched=new Set();
let userLatLng=null;
let tourActive=false;        // user pressed Start
let isPlaying=false;         // story playing right now
let currentStory=null;
let nextStory=null;          // pre-fetched, ready
let prefetchingId=null;
let landmarksLoaded=false;

// ── Init ──────────────────────────────────────────────────────
function initApp() {
  // Unlock iOS audio silently
  const u=new SpeechSynthesisUtterance(' '); u.volume=0;
  window.speechSynthesis.speak(u);
  document.getElementById('overlay').style.display='none';
  startGPS();
}

// ── GPS ───────────────────────────────────────────────────────
function startGPS() {
  setStatus('Getting location…');
  if (!navigator.geolocation) { usePosition(DUBLIN[0],DUBLIN[1]); return; }
  navigator.geolocation.getCurrentPosition(
    p => usePosition(p.coords.latitude, p.coords.longitude),
    ()  => usePosition(DUBLIN[0], DUBLIN[1]),
    {enableHighAccuracy:true, timeout:12000}
  );
}

function usePosition(lat,lng) {
  userLatLng={lat,lng};
  map.setView([lat,lng],15);
  const dot=L.divIcon({html:'<div style="width:14px;height:14px;background:#4a9eff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(74,158,255,.6)"></div>',iconSize:[14,14],iconAnchor:[7,7],className:''});
  const um=L.marker([lat,lng],{icon:dot}).addTo(map);
  setStatus('Loading landmarks…');
  doFetchLandmarks(lat,lng).then(()=>{ landmarksLoaded=true; });
  // Watch position
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(p=>{
      userLatLng={lat:p.coords.latitude,lng:p.coords.longitude};
      um.setLatLng([userLatLng.lat,userLatLng.lng]);
    },null,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }
}

// ── Tour start / stop ─────────────────────────────────────────
function toggleTour() {
  if (!tourActive) startTour();
  else stopTour();
}

function startTour() {
  tourActive=true;
  const btn=document.getElementById('start-tour-btn');
  btn.textContent='⏹ Stop Listening';
  btn.classList.add('stop');
  setStatus('Tour active');
  // If landmarks already loaded, play nearest immediately
  if (landmarksLoaded) playNearest();
  else setStatus('Loading landmarks…');
}

function stopTour() {
  tourActive=false;
  isPlaying=false;
  nextStory=null;
  prefetchingId=null;
  window.speechSynthesis.cancel();
  const btn=document.getElementById('start-tour-btn');
  btn.textContent='▶ Start Listening';
  btn.classList.remove('stop');
  document.getElementById('tour-bar').classList.remove('raised');
  hideStory();
  hideNextPreview();
  setStatus(Object.keys(markers).length+' landmarks on map');
}

// ── AI ────────────────────────────────────────────────────────
async function askAI(prompt) {
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const r=await fetch('/api/claude',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:prompt}]}),
      signal:ctrl.signal
    });
    clearTimeout(timer);
    if (!r.ok) throw new Error('API '+r.status);
    const d=await r.json();
    const txt=d?.content?.[0]?.text||'';
    if (!txt) throw new Error('Empty AI response');
    return txt;
  } catch(e) { clearTimeout(timer); throw e; }
}

async function geocode(q) {
  try {
    const d=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`,{headers:{'User-Agent':'StoryRouteApp/1.0'}}).then(r=>r.json());
    return d.length?{lat:+d[0].lat,lng:+d[0].lon}:null;
  } catch { return null; }
}

// ── Fetch landmarks ───────────────────────────────────────────
async function doFetchLandmarks(lat,lng) {
  const key=`${lat.toFixed(2)}_${lng.toFixed(2)}`;
  if (fetched.has(key)) return;
  fetched.add(key);
  setStatus('Searching for landmarks…');
  try {
    const raw=await askAI(
      `List up to 10 historically or culturally interesting places within 2km of lat ${lat.toFixed(4)}, lng ${lng.toFixed(4)}.
Include a varied mix: landmarks, neighbourhoods, streets with history, famous people who lived nearby (as "Home of [Name]"), parks, pubs with history.
Return ONLY a valid JSON array with no markdown:
[{"title":"Exact Place Name","type":"monument"}]
Valid types: monument,church,castle,street,building,bridge,park,museum,neighbourhood,person,nature,pub,other
Only include real places you are completely certain about.`
    );
    const start=raw.indexOf('['), end=raw.lastIndexOf(']');
    if (start===-1||end===-1) throw new Error('No JSON array in response');
    const arr=JSON.parse(raw.slice(start,end+1));
    if (!arr.length) { setStatus('No landmarks found here'); return; }

    let city='Ireland';
    try {
      const rev=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,{headers:{'User-Agent':'StoryRouteApp/1.0'}}).then(r=>r.json());
      city=rev?.address?.city||rev?.address?.town||rev?.address?.village||rev?.address?.county||'Ireland';
    } catch(e){}

    for (const p of arr) {
      if (!p.title) continue;
      const id=p.title.replace(/\W+/g,'_');
      if (markers[id]) continue;
      const coords=await geocode(`${p.title}, ${city}, Ireland`);
      if (!coords) continue;
      const emoji=TYPE_ICON[p.type]||'📍';
      const icon=L.divIcon({html:`<div class="lm-marker" id="lm-${id}">${emoji}</div>`,iconSize:[28,28],iconAnchor:[14,14],className:''});
      const m=L.marker([coords.lat,coords.lng],{icon,ptitle:p.title,ptype:p.type})
        .addTo(map).bindTooltip(p.title,{direction:'top'});
      m.on('click',()=>onMarkerClick({...p,...coords,id}));
      markers[id]=m;
    }

    const count=Object.keys(markers).length;
    setStatus(count+' landmark'+(count!==1?'s':'')+' found');
    // If tour is already active and nothing playing, start
    if (tourActive && !isPlaying) playNearest();

  } catch(e) {
    fetched.delete(key); // allow retry
    setStatus('Error: '+e.message);
    console.error(e);
  }
}

// ── Nearest ───────────────────────────────────────────────────
function nearestUnvisited(exclude=[]) {
  if (!userLatLng) return null;
  let best=null, bestD=Infinity;
  Object.entries(markers).forEach(([id,m])=>{
    if (visited.has(id)||exclude.includes(id)) return;
    const ll=m.getLatLng();
    const d=haversine(userLatLng,{lat:ll.lat,lng:ll.lng});
    if (d<bestD){bestD=d;best={id,title:m.options.ptitle,type:m.options.ptype,lat:ll.lat,lng:ll.lng,dist:Math.round(d)};}
  });
  return best;
}

// ── Play engine ───────────────────────────────────────────────
function playNearest() {
  if (!tourActive||isPlaying) return;
  const p=nearestUnvisited();
  if (p) playLandmark(p);
  else setStatus('No more landmarks nearby');
}

async function playLandmark(p) {
  if (!tourActive||isPlaying||visited.has(p.id)) return;
  visited.add(p.id);
  isPlaying=true;
  markDot(p.id,'visited');
  showStory(p.title,'⏳ Generating story…');
  document.getElementById('skip-btn').disabled=true;
  setStatus('Now: '+p.title+(p.dist?' ('+p.dist+'m)':''));

  try {
    const txt=await generateStory(p);
    if (!tourActive) { isPlaying=false; return; } // stopped while loading
    currentStory={...p,text:txt};
    showStory(p.title,txt);
    // Start prefetching NEXT before we even speak
    const next=nearestUnvisited([p.id]);
    if (next) prefetchInBackground(next);
    speak(txt, onStoryEnd);
  } catch(e) {
    isPlaying=false;
    setStatus('Story failed — trying next in 5s');
    if (tourActive) setTimeout(playNearest, 5000);
  }
}

function onStoryEnd() {
  if (!tourActive) { isPlaying=false; return; }
  isPlaying=false;
  hideNextPreview();
  document.getElementById('skip-btn').disabled=true;
  if (nextStory) {
    const s=nextStory; nextStory=null; prefetchingId=null;
    setTimeout(()=>playLandmark(s), 1500); // 1.5s pause between stories
  } else {
    setStatus('Looking for next landmark…');
    setTimeout(playNearest, 3000);
  }
}

// Background prefetch — only one at a time
async function prefetchInBackground(p) {
  if (visited.has(p.id)||prefetchingId===p.id||nextStory) return;
  prefetchingId=p.id;
  showNextPreview(`⏳ Preparing next: <b>${p.title}</b>`);
  try {
    const txt=await generateStory(p);
    if (!visited.has(p.id)&&tourActive) {
      nextStory={...p,text:txt};
      showNextPreview(`✅ Next ready: <b>${p.title}</b>`);
      document.getElementById('skip-btn').disabled=false;
    }
  } catch(e) { prefetchingId=null; hideNextPreview(); }
}

async function generateStory(p) {
  return await askAI(
    `You are a captivating GPS audio tour guide. Write a vivid 3-sentence historical story about "${p.title}" (${p.type}) in Ireland.
${p.type==='person'?'Focus on their life, why they lived here and their legacy.':''}
${p.type==='neighbourhood'?'Focus on the history and character of this area.':''}
${p.type==='street'?'Focus on how this street got its name and historical significance.':''}
${p.type==='pub'?'Focus on the history and famous visitors.':''}
Begin with "As you approach…" or "You're now near…". Max 75 words. Return ONLY the story text.`
  );
}

// ── Skip — only works when next story is ready ────────────────
function skipStory() {
  if (!nextStory) return; // nothing to skip to — button should be disabled anyway
  window.speechSynthesis.cancel();
  isPlaying=false;
  const s=nextStory; nextStory=null; prefetchingId=null;
  hideNextPreview();
  document.getElementById('skip-btn').disabled=true;
  setTimeout(()=>playLandmark(s), 300);
}

// ── Tap a marker manually ─────────────────────────────────────
function onMarkerClick(p) {
  if (!tourActive) {
    // If tour not started, just show info
    setStatus('Press ▶ Start Listening to hear stories');
    return;
  }
  if (isPlaying) return; // already playing, ignore
  playLandmark(p);
}

// ── Audio ─────────────────────────────────────────────────────
function speak(txt,onEnd) {
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.rate=0.88; u.volume=1;
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang==='en-GB'&&v.localService)||voices.find(v=>v.lang.startsWith('en'))||voices[0];
  if(v) u.voice=v;
  u.onend=onEnd; u.onerror=()=>{console.warn('Speech error');onEnd();};
  window.speechSynthesis.speak(u);
}
function replayStory() { if(currentStory&&tourActive) speak(currentStory.text,onStoryEnd); }

// ── UI ────────────────────────────────────────────────────────
function showStory(name,text) {
  document.getElementById('story-name').textContent=name;
  document.getElementById('story-text').textContent=text;
  document.getElementById('story').style.display='block';
  document.getElementById('tour-bar').classList.add('raised');
}
function hideStory() {
  document.getElementById('story').style.display='none';
  document.getElementById('tour-bar').classList.remove('raised');
}
function showNextPreview(html){const el=document.getElementById('next-preview');el.innerHTML=html;el.style.display='block';}
function hideNextPreview(){document.getElementById('next-preview').style.display='none';}
function markDot(id,cls){const el=document.getElementById('lm-'+id);if(el)el.classList.add(cls);}
function setStatus(t){document.getElementById('status').textContent=t;}
function setMode(m){
  document.getElementById('btn-explore').classList.toggle('active',m==='explore');
  document.getElementById('btn-route').classList.toggle('active',m==='route');
  document.getElementById('route-panel').classList.toggle('visible',m==='route');
}

// ── Route ─────────────────────────────────────────────────────
async function planRoute(){
  const from=document.getElementById('from-inp').value.trim();
  const to=document.getElementById('to-inp').value.trim();
  if(!from||!to) return;
  const btn=document.getElementById('route-btn'); btn.disabled=true;
  setStatus('Planning route…');
  try {
    const [A,B]=await Promise.all([geocode(from),geocode(to)]);
    if(!A||!B){alert('Could not find one of the locations.');btn.disabled=false;return;}
    const osrm=await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lng},${A.lat};${B.lng},${B.lat}?overview=full&geometries=geojson`).then(r=>r.json());
    const coords=osrm?.routes?.[0]?.geometry?.coordinates;
    if(!coords){alert('No route found.');btn.disabled=false;return;}
    if(map.routeLine) map.removeLayer(map.routeLine);
    map.routeLine=L.polyline(coords.map(c=>[c[1],c[0]]),{color:'#f0a500',weight:5,opacity:0.85}).addTo(map);
    map.fitBounds(map.routeLine.getBounds(),{padding:[60,60]});
    setStatus('Finding landmarks along route…');
    const pts=Array.from({length:8},(_,i)=>coords[Math.floor(i*(coords.length-1)/7)]);
    for(const pt of pts) await doFetchLandmarks(pt[1],pt[0]);
    btn.disabled=false; setMode('explore');
  } catch(e){btn.disabled=false;setStatus('Route error: '+e.message);}
}

// ── Utils ─────────────────────────────────────────────────────
function haversine(a,b){
  const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

if(window.speechSynthesis.onvoiceschanged!==undefined) window.speechSynthesis.onvoiceschanged=()=>{};
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
