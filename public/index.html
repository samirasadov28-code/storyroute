<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryRoute</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.1.3/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111827; color:#fff; font-family:sans-serif; overflow:hidden; }
#map { width:100vw; height:100vh; }
#header { position:fixed; top:0; left:0; right:0; padding:12px 16px; background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent); display:flex; justify-content:space-between; align-items:center; z-index:1000; pointer-events:none; }
#title { font-size:20px; font-weight:800; }
#title span { color:#f0a500; }
#status { font-size:11px; background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:12px; color:rgba(255,255,255,0.5); }
#story { position:fixed; bottom:0; left:0; right:0; padding:16px; background:rgba(10,10,22,0.97); border-top:1px solid rgba(255,255,255,0.1); display:none; z-index:1000; }
#story-name { font-size:10px; font-weight:700; color:#f0a500; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:6px; }
#story-text { font-size:14px; line-height:1.7; color:rgba(255,255,255,0.9); margin-bottom:12px; }
#story-btns { display:flex; gap:8px; }
#play-btn { flex:1; padding:10px; background:#f0a500; color:#000; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; }
#close-btn { padding:10px 14px; background:rgba(255,255,255,0.08); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
#notice { position:fixed; bottom:16px; left:16px; right:16px; background:rgba(240,165,0,0.08); border:1px solid rgba(240,165,0,0.25); border-radius:10px; padding:8px 12px; font-size:11px; color:rgba(255,255,255,0.45); text-align:center; z-index:999; transition:bottom .3s; }
#spinner { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(10,10,22,0.95); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:18px 28px; font-size:12px; color:rgba(255,255,255,0.6); display:none; z-index:2000; text-align:center; }
.spin { width:28px; height:28px; border:3px solid rgba(240,165,0,0.2); border-top-color:#f0a500; border-radius:50%; animation:sp 1s linear infinite; margin:0 auto 8px; }
@keyframes sp { to { transform:rotate(360deg); } }
.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display:none; }
</style>
</head>
<body>

<div id="map"></div>

<div id="header">
  <div id="title">Story<span>Route</span></div>
  <div id="status">Loading map…</div>
</div>

<div id="story">
  <div id="story-name"></div>
  <div id="story-text"></div>
  <div id="story-btns">
    <button id="play-btn" onclick="playStory()">▶ Play Audio</button>
    <button id="close-btn" onclick="closeStory()">✕</button>
  </div>
</div>

<div id="notice">📍 Click a gold dot to hear its story</div>
<div id="spinner"><div class="spin"></div><span id="spin-txt">Loading…</span></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>
<script>
// ── CONFIG — paste your Maptiler key here ─────────────────────
const MAPTILER_KEY = 'YOUR_MAPTILER_KEY';

const DUBLIN = { lat: 53.3438, lng: -6.2546 };
let map, markers = {}, visited = new Set(), currentStoryText = '', fetched = new Set();

// ── Map ───────────────────────────────────────────────────────
map = new maplibregl.Map({
  container: 'map',
  style: `https://api.maptiler.com/maps/dataviz-dark/style.json?key=${MAPTILER_KEY}`,
  center: [DUBLIN.lng, DUBLIN.lat],
  zoom: 15,
  pitch: 45,
  bearing: -10,
  antialias: true
});

map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');

map.on('load', () => {
  // ── 3D buildings ──────────────────────────────────────────
  map.addLayer({
    id: '3d-buildings',
    source: 'openmaptiles',
    'source-layer': 'building',
    type: 'fill-extrusion',
    minzoom: 14,
    paint: {
      'fill-extrusion-color': [
        'interpolate', ['linear'], ['zoom'],
        14, '#1a1f2e',
        16, '#22283a'
      ],
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 10],
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
      'fill-extrusion-opacity': 0.85
    }
  });

  setStatus('Locating you…');
  startGPS();
  fetchLandmarks(DUBLIN.lat, DUBLIN.lng);
});

map.on('moveend', () => {
  const c = map.getCenter();
  fetchLandmarks(c.lat, c.lng);
});

// ── GPS ───────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) { setStatus('Demo · Dublin City Centre'); return; }
  navigator.geolocation.getCurrentPosition(
    p => {
      map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 15, pitch: 45 });
      // user dot
      const el = document.createElement('div');
      el.style.cssText = 'width:14px;height:14px;background:#4a9eff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(74,158,255,0.7)';
      new maplibregl.Marker({ element: el }).setLngLat([p.coords.longitude, p.coords.latitude]).addTo(map);
      setStatus('GPS active');
      fetchLandmarks(p.coords.latitude, p.coords.longitude);
    },
    () => setStatus('Demo · Dublin City Centre'),
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

// ── Groq via Netlify Function ─────────────────────────────────
async function askAI(prompt) {
  const r = await fetch('/api/claude', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: [{ role: 'user', content: prompt }] })
  });
  const d = await r.json();
  return d?.content?.[0]?.text || '';
}

// ── Landmark type icons ───────────────────────────────────────
const TYPE_ICON = {
  monument: '🏛', church: '⛪', castle: '🏰', street: '🛤',
  building: '🏢', bridge: '🌉', park: '🌿', museum: '🎭', other: '📍'
};

// ── Geocode a landmark name via Nominatim ─────────────────────
async function geocode(name, cityHint) {
  try {
    const q = encodeURIComponent(`${name}, ${cityHint}`);
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`, {
      headers: { 'Accept-Language': 'en', 'User-Agent': 'StoryRouteApp/1.0' }
    });
    const d = await r.json();
    if (d.length) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
  } catch(e) {}
  return null;
}

// ── Landmarks ─────────────────────────────────────────────────
async function fetchLandmarks(lat, lng) {
  const key = `${lat.toFixed(2)}_${lng.toFixed(2)}`;
  if (fetched.has(key)) return;
  fetched.add(key);
  setStatus('Finding landmarks…');

  // Step 1 — get landmark names + types from AI (no coords)
  let arr = [];
  try {
    const txt = await askAI(
      `List up to 8 historically or culturally interesting landmarks within 1km of (${lat.toFixed(4)}, ${lng.toFixed(4)}).
Return ONLY a raw JSON array: [{"title":"Exact landmark name","type":"monument"}]
Types: monument, church, castle, street, building, bridge, park, museum, other
Use the exact, official name of each place. Only real places you are certain exist.`
    );
    arr = JSON.parse(txt.replace(/```json|```/g, '').trim());
  } catch(e) { setStatus('Error loading landmarks'); return; }

  // Step 2 — geocode each name via Nominatim for accurate coords
  // Get city name from reverse geocode for better search context
  let cityHint = 'Dublin, Ireland';
  try {
    const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`, { headers:{'User-Agent':'StoryRouteApp/1.0'} }).then(r=>r.json());
    cityHint = rev?.address?.city || rev?.address?.town || rev?.address?.county || 'Dublin, Ireland';
  } catch(e) {}

  let added = 0;
  for (const p of arr) {
    const id = p.title.replace(/\s+/g,'_');
    if (markers[id]) continue;
    const coords = await geocode(p.title, cityHint);
    if (!coords) continue;

    const emoji = TYPE_ICON[p.type] || '📍';
    const el = document.createElement('div');
    el.style.cssText = `
      width:32px; height:32px; display:flex; align-items:center; justify-content:center;
      font-size:20px; cursor:pointer; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      animation:pulse 2.5s infinite;
    `;
    el.textContent = emoji;
    el.title = p.title;

    const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([coords.lng, coords.lat])
      .setPopup(new maplibregl.Popup({ offset:20, closeButton:false })
        .setHTML(`<div style="font-size:12px;font-weight:700;color:#f0a500">${emoji} ${p.title}</div>`))
      .addTo(map);

    el.addEventListener('click', () => triggerStory({ ...p, ...coords, id, el }));
    markers[id] = marker;
    added++;
  }

  setStatus(Object.keys(markers).length + ' landmarks · tap an icon');
}

// ── Story ─────────────────────────────────────────────────────
async function triggerStory(p) {
  if (visited.has(p.id)) { showStory(p.title, currentStoryText); return; }
  visited.add(p.id);
  p.el.style.background = 'rgba(240,165,0,0.3)';
  p.el.style.animation = 'none';
  map.flyTo({ center: [p.lng, p.lat], zoom: 16, pitch: 55, bearing: Math.random() * 60 - 30, duration: 1200 });
  showSpinner(`Uncovering "${p.title}"…`);
  try {
    const txt = await askAI(
      `You are a captivating GPS audio tour guide. Tell a vivid 3-sentence historical story about "${p.title}" (type: ${p.type}).
Start with "As you approach…" or "You're now near…". Max 75 words. Return ONLY the story.`
    );
    currentStoryText = txt;
    hideSpinner();
    showStory(p.title, txt);
    speak(txt);
  } catch(e) { hideSpinner(); setStatus('Error generating story'); }
}

function showStory(name, text) {
  document.getElementById('story-name').textContent = name;
  document.getElementById('story-text').textContent = text;
  document.getElementById('story').style.display = 'block';
  document.getElementById('notice').style.bottom = '165px';
}
function closeStory() {
  document.getElementById('story').style.display = 'none';
  document.getElementById('notice').style.bottom = '16px';
  window.speechSynthesis.cancel();
}
function playStory() { if (currentStoryText) speak(currentStoryText); }
function speak(txt) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en')) || voices[0];
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

function setStatus(t) { document.getElementById('status').textContent = t; }
function showSpinner(t) { document.getElementById('spin-txt').textContent = t; document.getElementById('spinner').style.display = 'block'; }
function hideSpinner() { document.getElementById('spinner').style.display = 'none'; }

if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
