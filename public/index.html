<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryRoute</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111827; color:#fff; font-family:sans-serif; overflow:hidden; }
#map { width:100vw; height:100vh; }
#header { position:fixed; top:0; left:0; right:0; padding:12px 16px; background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent); display:flex; justify-content:space-between; align-items:center; z-index:1000; pointer-events:none; }
#title { font-size:20px; font-weight:800; }
#title span { color:#f0a500; }
#status { font-size:11px; background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:12px; color:rgba(255,255,255,0.5); }
#mode-toggle { position:fixed; top:58px; left:50%; transform:translateX(-50%); z-index:999; display:flex; background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.12); border-radius:20px; overflow:hidden; }
.mode-btn { padding:7px 18px; font-size:12px; font-weight:700; border:none; background:transparent; color:rgba(255,255,255,0.45); cursor:pointer; transition:all .2s; }
.mode-btn.active { background:#f0a500; color:#000; }
#route-panel { position:fixed; top:100px; left:16px; right:16px; z-index:999; background:rgba(13,13,26,0.97); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px; display:none; }
#route-panel.visible { display:block; }
.r-input { width:100%; padding:10px 13px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:8px; color:#fff; font-size:14px; outline:none; margin-bottom:8px; box-sizing:border-box; }
.r-input::placeholder { color:rgba(255,255,255,0.3); }
.r-input:focus { border-color:#f0a500; }
.r-btn { width:100%; padding:11px; background:#f0a500; color:#000; border:none; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer; }
.r-btn:disabled { background:#444; color:#888; cursor:not-allowed; }
#story { position:fixed; bottom:0; left:0; right:0; padding:16px; background:rgba(10,10,22,0.97); border-top:1px solid rgba(255,255,255,0.1); display:none; z-index:1000; }
#story-name { font-size:10px; font-weight:700; color:#f0a500; text-transform:uppercase; letter-spacing:1.2px; margin-bottom:6px; }
#story-text { font-size:14px; line-height:1.7; color:rgba(255,255,255,0.9); margin-bottom:12px; }
#story-btns { display:flex; gap:8px; }
#play-btn { flex:1; padding:10px; background:#f0a500; color:#000; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:14px; }
#close-btn { padding:10px 14px; background:rgba(255,255,255,0.08); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
#notice { position:fixed; bottom:16px; left:16px; right:16px; background:rgba(240,165,0,0.08); border:1px solid rgba(240,165,0,0.25); border-radius:10px; padding:8px 12px; font-size:11px; color:rgba(255,255,255,0.45); text-align:center; z-index:999; transition:bottom .3s; }
#spinner { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(10,10,22,0.95); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:18px 28px; font-size:12px; color:rgba(255,255,255,0.6); display:none; z-index:2000; text-align:center; }
.spin { width:28px; height:28px; border:3px solid rgba(240,165,0,0.2); border-top-color:#f0a500; border-radius:50%; animation:sp 1s linear infinite; margin:0 auto 8px; }
@keyframes sp { to { transform:rotate(360deg); } }
.lm-marker { font-size:22px; cursor:pointer; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8)); transition:transform .2s; }
.lm-marker:hover { transform:scale(1.2); }
.lm-marker.visited { opacity:0.35; filter:grayscale(1); }
.leaflet-tooltip { background:rgba(10,10,22,.95); border:1px solid rgba(240,165,0,.4); color:#fff; font-size:12px; font-weight:600; padding:4px 9px; border-radius:6px; }
.leaflet-tooltip::before { border-top-color:rgba(240,165,0,.4); }
</style>
</head>
<body>

<div id="map"></div>

<div id="header">
  <div id="title">Story<span>Route</span></div>
  <div id="status">Locating you…</div>
</div>

<div id="mode-toggle">
  <button class="mode-btn active" id="btn-explore" onclick="setMode('explore')">📍 Explore</button>
  <button class="mode-btn" id="btn-route" onclick="setMode('route')">🗺️ Route</button>
</div>

<div id="route-panel">
  <input class="r-input" id="from-inp" placeholder="📍 From — e.g. Dublin Airport"/>
  <input class="r-input" id="to-inp"   placeholder="🏁 To — e.g. Trinity College Dublin"/>
  <button class="r-btn" id="route-btn" onclick="planRoute()">Plan Route & Discover Stories</button>
</div>

<div id="story">
  <div id="story-name"></div>
  <div id="story-text"></div>
  <div id="story-btns">
    <button id="play-btn" onclick="playStory()">▶ Play Audio</button>
    <button id="close-btn" onclick="closeStory()">✕</button>
  </div>
</div>

<div id="notice">📍 Click a landmark icon to hear its story</div>
<div id="spinner"><div class="spin"></div><span id="spin-txt">Loading…</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DUBLIN = [53.3438, -6.2546];
const TYPE_ICON = {
  monument:'🏛', church:'⛪', castle:'🏰', street:'🛤',
  building:'🏢', bridge:'🌉', park:'🌿', museum:'🎭',
  neighbourhood:'🏘', person:'👤', nature:'🌊', pub:'🍺', other:'📍'
};
let map, markers = {}, visited = new Set(), currentStoryText = '', fetched = new Set();
let currentMode = 'explore';

// ── Map ───────────────────────────────────────────────────────
map = L.map('map', { zoomControl:true, attributionControl:false }).setView(DUBLIN, 15);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(map);
map.on('moveend', () => { const c = map.getCenter(); fetchLandmarks(c.lat, c.lng); });

// ── GPS ───────────────────────────────────────────────────────
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    p => {
      const ll = [p.coords.latitude, p.coords.longitude];
      map.setView(ll, 15);
      const userIcon = L.divIcon({ html:'<div style="width:14px;height:14px;background:#4a9eff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(74,158,255,0.7)"></div>', iconSize:[14,14], iconAnchor:[7,7], className:'' });
      L.marker(ll, { icon:userIcon }).addTo(map);
      setStatus('GPS active');
      fetchLandmarks(...ll);
    },
    () => { setStatus('Demo · Dublin City Centre'); fetchLandmarks(...DUBLIN); },
    { enableHighAccuracy:true, timeout:8000 }
  );
} else { setStatus('Demo · Dublin City Centre'); fetchLandmarks(...DUBLIN); }

// ── AI via Netlify Function ───────────────────────────────────
async function askAI(prompt) {
  const r = await fetch('/api/claude', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ messages:[{ role:'user', content:prompt }] })
  });
  const d = await r.json();
  return d?.content?.[0]?.text || '';
}

// ── Geocode via Nominatim ─────────────────────────────────────
async function nominatimGeocode(q) {
  try {
    const d = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`, { headers:{'Accept-Language':'en','User-Agent':'StoryRouteApp/1.0'} }).then(r=>r.json());
    return d.length ? { lat:+d[0].lat, lng:+d[0].lon } : null;
  } catch { return null; }
}

// ── Fetch landmarks ───────────────────────────────────────────
async function fetchLandmarks(lat, lng) {
  const key = `${lat.toFixed(2)}_${lng.toFixed(2)}`;
  if (fetched.has(key)) return;
  fetched.add(key);
  setStatus('Finding landmarks…');
  try {
    const txt = await askAI(
      `List up to 12 interesting points of interest within 2km of (${lat.toFixed(4)}, ${lng.toFixed(4)}).
Be broad and varied — include a mix of:
- Historical landmarks (monuments, castles, churches, bridges)
- Neighbourhoods and village areas (e.g. Howth, Baldoyle, Clontarf)
- Named streets or roads with historical significance
- Famous or notable people who were born, lived or died nearby (format as "Home of [Name]" or "[Name]'s Birthplace")
- Parks, coastal features, natural landmarks
- Pubs, markets or buildings with strong local history
Return ONLY a raw JSON array: [{"title":"Exact name","type":"monument"}]
Types: monument, church, castle, street, building, bridge, park, museum, neighbourhood, person, nature, pub, other
Use exact official names. Only include real places or people you are certain about.`
    );
    const arr = JSON.parse(txt.replace(/```json|```/g,'').trim());

    // Reverse geocode for city context
    let cityHint = 'Ireland';
    try {
      const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,{headers:{'User-Agent':'StoryRouteApp/1.0'}}).then(r=>r.json());
      cityHint = rev?.address?.city || rev?.address?.town || rev?.address?.county || 'Ireland';
    } catch(e) {}

    for (const p of arr) {
      const id = p.title.replace(/\s+/g,'_');
      if (markers[id]) continue;
      const coords = await nominatimGeocode(`${p.title}, ${cityHint}`);
      if (!coords) continue;
      const emoji = TYPE_ICON[p.type] || '📍';
      const icon = L.divIcon({ html:`<div class="lm-marker" id="lm-${id}">${emoji}</div>`, iconSize:[28,28], iconAnchor:[14,14], className:'' });
      const m = L.marker([coords.lat, coords.lng], { icon })
        .addTo(map)
        .bindTooltip(p.title, { direction:'top', permanent:false });
      m.on('click', () => triggerStory({ ...p, ...coords, id }));
      markers[id] = m;
    }
    setStatus(Object.keys(markers).length + ' landmarks · tap an icon');
  } catch(e) { setStatus('Error loading landmarks'); }
}

// ── Story ─────────────────────────────────────────────────────
async function triggerStory(p) {
  if (visited.has(p.id)) { showStory(p.title, currentStoryText); return; }
  visited.add(p.id);
  const el = document.getElementById(`lm-${p.id}`);
  if (el) el.classList.add('visited');
  map.flyTo([p.lat, p.lng], 16, { duration:1 });
  showSpinner(`Uncovering "${p.title}"…`);
  try {
    const txt = await askAI(
      `You are a captivating GPS audio tour guide. Tell a vivid 3-sentence historical story about "${p.title}" (type: ${p.type}).
Start with "As you approach…" or "You're now near…". Max 75 words. Return ONLY the story.`
    );
    currentStoryText = txt;
    hideSpinner();
    showStory(p.title, txt);
    speak(txt);
  } catch(e) { hideSpinner(); setStatus('Error generating story'); }
}

function showStory(name, text) {
  document.getElementById('story-name').textContent = name;
  document.getElementById('story-text').textContent = text;
  document.getElementById('story').style.display = 'block';
  document.getElementById('notice').style.bottom = '165px';
}
function closeStory() {
  document.getElementById('story').style.display = 'none';
  document.getElementById('notice').style.bottom = '16px';
  window.speechSynthesis.cancel();
}
function playStory() { if (currentStoryText) speak(currentStoryText); }
function speak(txt) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang.startsWith('en')) || voices[0];
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

// ── Mode toggle ───────────────────────────────────────────────
function setMode(m) {
  currentMode = m;
  document.getElementById('btn-explore').classList.toggle('active', m==='explore');
  document.getElementById('btn-route').classList.toggle('active', m==='route');
  document.getElementById('route-panel').classList.toggle('visible', m==='route');
}

// ── Route planning ────────────────────────────────────────────
async function planRoute() {
  const from = document.getElementById('from-inp').value.trim();
  const to   = document.getElementById('to-inp').value.trim();
  if (!from || !to) return;
  const btn = document.getElementById('route-btn');
  btn.disabled = true;
  showSpinner('Geocoding locations…');
  try {
    const [A, B] = await Promise.all([nominatimGeocode(from), nominatimGeocode(to)]);
    if (!A || !B) { hideSpinner(); btn.disabled=false; alert('Could not find one of the locations. Try adding a city name.'); return; }
    setLoaderText('Plotting route…');
    const osrm = await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lng},${A.lat};${B.lng},${B.lat}?overview=full&geometries=geojson`).then(r=>r.json());
    const coords = osrm?.routes?.[0]?.geometry?.coordinates;
    if (!coords) { hideSpinner(); btn.disabled=false; alert('No route found.'); return; }
    // Draw route
    if (map.routeLine) map.removeLayer(map.routeLine);
    map.routeLine = L.polyline(coords.map(c=>[c[1],c[0]]), { color:'#f0a500', weight:5, opacity:0.8 }).addTo(map);
    map.fitBounds(map.routeLine.getBounds(), { padding:[50,50] });
    // Fetch landmarks along route
    setLoaderText('Discovering landmarks…');
    const samples = samplePoints(coords, 6);
    for (const pt of samples) await fetchLandmarks(pt[1], pt[0]);
    hideSpinner(); btn.disabled=false;
    setMode('explore');
  } catch(e) { hideSpinner(); btn.disabled=false; }
}

function samplePoints(coords, n) {
  const step = Math.floor(coords.length / n);
  return Array.from({ length:n }, (_,i) => coords[Math.min(i*step, coords.length-1)]);
}

// ── Helpers ───────────────────────────────────────────────────
function setStatus(t) { document.getElementById('status').textContent = t; }
function showSpinner(t) { document.getElementById('spin-txt').textContent=t; document.getElementById('spinner').style.display='block'; }
function hideSpinner() { document.getElementById('spinner').style.display='none'; }
function setLoaderText(t) { document.getElementById('spin-txt').textContent=t; }

if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
